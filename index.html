<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movato — Շուտով</title>
<meta name="description" content="Movato — բերում ենք նոր ապրանքանիշեր և նոր մշակույթ։ Շուտով։">
<meta name="theme-color" content="#019eae">
<!-- Pre-launch: reachable by link, kept out of search results. -->
<meta name="robots" content="noindex, nofollow">

<meta property="og:title" content="Movato — Coming soon">
<meta property="og:description" content="We’re bringing you new brands and a new culture.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Geologica carries no Armenian subset, so Armenian glyphs fall through to
     Noto Sans Armenian. unicode-range makes that per-glyph and automatic. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&family=Noto+Sans+Armenian:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css?v=00aa882e">
</head>
<body>

<!-- The whole teal block: a header band, then the clip. The band's background is
     painted from preview.mp4 itself rather than a CSS colour, so it is the same
     teal as the frame below it on every rendering path — see README. -->
<div class="hero">

  <div class="hero__ground" aria-hidden="true">
    <video class="fill" muted loop playsinline preload="none"
           disablepictureinpicture tabindex="-1"></video>
  </div>

  <div class="hero__bar">
    <span aria-hidden="true"></span>
    <h1 class="hero__title" data-i18n="tagline">Շուտով</h1>
    <nav class="switcher" aria-label="Subtitle language" data-i18n-aria="switcherLabel">
      <!-- buttons injected by main.js from SUBTITLE_LANGUAGES -->
    </nav>
  </div>

  <!-- A window onto 34.5%–79.5% of the frame: measured across the whole clip,
       every non-teal pixel falls between 40.0% and 71.9%, so everything outside
       that window is flat teal carrying nothing. -->
  <div class="showcase">
    <div class="frame" id="frame">
      <!-- Two elements, not one. The next clip is loaded into whichever is
           idle while the other plays, so the swap is a crossfade between two
           decoded videos rather than a blank frame waiting on a download.
           main.js picks which clip each one gets; neither has a src here, so
           only the chosen clip is ever fetched. No `loop` — the clip has to
           end for `ended` to fire, and that is what rotates the banner. -->
      <video class="frame__video is-active" id="videoA"
             muted autoplay playsinline preload="auto"
             disablepictureinpicture aria-label="Movato preview"></video>
      <video class="frame__video" id="videoB"
             muted playsinline preload="auto"
             disablepictureinpicture aria-hidden="true" tabindex="-1"></video>

    </div>
  </div>
</div>

<main class="page">
  <div class="form-head">
    <p class="lede" data-i18n="formTitle">ԱՄՆ-ից, Եվրոպայից և Ասիայից առաքումների նոր իրականություն</p>
    <p class="subtitle" data-i18n="subtitle">Լրացրու քո էլ. հասցեն և առաջինն իմացիր Movato-ի մեկնարկի մասին։</p>
  </div>

  <form class="signup" id="subscribeForm" novalidate>

    <div class="field">
      <label class="field__label" for="email" data-i18n="emailLabel">Էլ. հասցե</label>
      <input class="field__input" type="email" id="email" name="email"
             required autocomplete="email" inputmode="email" spellcheck="false"
             placeholder="you@example.com" data-i18n-placeholder="emailPlaceholder">
    </div>

    <!-- Bots fill every field they find; people never see this one. -->
    <div class="u-visually-hidden" aria-hidden="true">
      <label for="website">Website</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <button class="signup__btn" type="submit" data-i18n="submit">Նախագրանցվել</button>

    <p class="signup__msg" id="subscribeMsg" role="status" aria-live="polite"></p>
  </form>
</main>

<script src="assets/js/config.js?v=daaf820b"></script>
<script src="assets/js/subtitles.js?v=b5826ca3"></script>
<script src="assets/js/videos.js?v=feb8e8f7"></script>
<script src="assets/js/main.js?v=317309e8"></script>
<script src="assets/js/subscribe.js?v=8b2efc38"></script>
</body>
</html>
