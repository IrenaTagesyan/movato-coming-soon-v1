<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movato — Շուտով</title>
<meta name="description" content="Movato — բերում ենք նոր ապրանքանիշեր և նոր մշակույթ։ Շուտով։">
<meta name="theme-color" content="#019eae">
<!-- Pre-launch: reachable by link, kept out of search results. -->
<meta name="robots" content="noindex, nofollow">

<meta property="og:title" content="Movato — Coming soon">
<meta property="og:description" content="We’re bringing you new brands and a new culture.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/video/poster.jpg">

<link rel="preload" as="video" href="assets/video/preview.mp4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Geologica carries no Armenian subset, so Armenian glyphs fall through to
     Noto Sans Armenian. unicode-range makes that per-glyph and automatic. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&family=Noto+Sans+Armenian:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- The whole teal block: a header band, then the clip. The band's background is
     painted from preview.mp4 itself rather than a CSS colour, so it is the same
     teal as the frame below it on every rendering path — see README. -->
<div class="hero">

  <div class="hero__ground" aria-hidden="true">
    <video class="fill" data-src="assets/video/preview.mp4"
           muted loop playsinline preload="none"
           disablepictureinpicture tabindex="-1"></video>
  </div>

  <div class="hero__bar">
    <span aria-hidden="true"></span>
    <h1 class="hero__title" data-i18n="tagline">Շուտով</h1>
    <nav class="switcher" aria-label="Subtitle language" data-i18n-aria="switcherLabel">
      <!-- buttons injected by main.js from SUBTITLE_LANGUAGES -->
    </nav>
  </div>

  <!-- A window onto 34.5%–79.5% of the frame: measured across the whole clip,
       every non-teal pixel falls between 40.0% and 71.9%, so everything outside
       that window is flat teal carrying nothing. -->
  <div class="showcase">
    <div class="frame" id="frame">
      <video
        class="frame__video"
        id="video"
        src="assets/video/preview.mp4"
        poster="assets/video/poster.jpg"
        muted
        loop
        autoplay
        playsinline
        preload="auto"
        disablepictureinpicture
        aria-label="Movato preview"></video>

      <!-- Hides the Armenian caption burned into the pixels, with a patch of
           the clip's own flat teal. -->
      <div class="frame__mask" aria-hidden="true">
        <video class="fill" data-src="assets/video/preview.mp4"
               muted loop playsinline preload="none"
               disablepictureinpicture tabindex="-1"></video>
      </div>

      <!-- The caption, re-rendered in the selected language. -->
      <div class="caption" id="caption" role="status" aria-live="polite"
           aria-label="Video subtitles" data-i18n-aria="captionRegion">
        <span class="caption__lead" id="captionLead"></span>
        <span class="caption__part caption__accent" id="captionAccent"></span>
      </div>
    </div>
  </div>
</div>

<main class="page">
  <div class="form-head">
    <p class="lede" data-i18n="formTitle">Թողեք ձեր էլ. փոստը և առաջինը իմացեք բացման մասին։</p>
    <p class="subtitle" data-i18n="subtitle">Մեկ նամակ բացման օրը՝ ուրիշ ոչինչ։</p>
  </div>

  <form class="signup" id="subscribeForm" novalidate>

    <div class="field">
      <label class="field__label" for="email" data-i18n="emailLabel">Էլ. փոստ</label>
      <input class="field__input" type="email" id="email" name="email"
             required autocomplete="email" inputmode="email" spellcheck="false"
             placeholder="you@example.com" data-i18n-placeholder="emailPlaceholder">
    </div>

    <!-- Bots fill every field they find; people never see this one. -->
    <div class="u-visually-hidden" aria-hidden="true">
      <label for="website">Website</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <button class="signup__btn" type="submit" data-i18n="submit">Բաժանորդագրվել</button>

    <p class="signup__msg" id="subscribeMsg" role="status" aria-live="polite"></p>
  </form>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/subtitles.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/subscribe.js"></script>
</body>
</html>
